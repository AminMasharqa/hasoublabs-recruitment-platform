rules:
  # ─── Rule 1: Platform must not import domain modules ───────────────────────
  - id: platform-imports-domain
    pattern-either:
      - pattern: from app.modules.$M import $X
      - pattern: from app.modules import $X
      - pattern: import app.modules.$M
    message: |
      Platform layer (`app/platform/`) must never import from a domain module
      (`app/modules/`). Dependency must be one-way: domain → platform.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - "app/platform/"
      exclude:
        # Alembic's model registry: it must import every module's models.py so
        # autogenerate sees all tables. A composition root, like app/main.py.
        - "app/platform/db/metadata.py"

  # ─── Rule 2: Domain modules must only import siblings through api.py ────────
  # One rule per module: a path glob cannot name "the module this file is in",
  # so each rule is scoped to one module's directory and lets that module import
  # its own internals. A new module under app/modules/ needs a rule here.
  - id: cross-module-internal-import-applications
    # A whole-path regex on $MOD, because `from app.modules.$OTHER import ...`
    # binds $OTHER to a dotted path (`cvs.errors`). The `[\w.]+$` anchors also
    # reject a quirk where `import $MOD` matches a from-import and binds the
    # rest of the line.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: from $MOD import $X
              - pattern: import $MOD
          - metavariable-regex:
              metavariable: $MOD
              regex: ^app\.modules\.(?!applications\.)\w+\.(?!(?:api|schemas)$)[\w.]+$
      - patterns:
          - pattern: from $MOD import $X
          - metavariable-regex:
              metavariable: $MOD
              regex: ^app\.modules\.(?!applications$)\w+$
          - metavariable-regex:
              metavariable: $X
              regex: ^(?!(?:api|schemas)$)
    message: |
      A module may import from another module ONLY through its `api.py` or
      `schemas.py` (`$MOD`). This violates the module-boundary contract.
      Fix: use what `app.modules.<module>.api` exposes instead.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - "app/modules/applications/"

