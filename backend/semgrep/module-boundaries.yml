  # ─── Rule 3: No fastapi import outside router.py ────────────────────────────
  - id: fastapi-outside-router
    pattern-either:
      - pattern: import fastapi
      - pattern: import fastapi.$S
      - pattern: from fastapi import $X
      - pattern: from fastapi.$S import $X
    message: |
      `fastapi` may only be imported in `router.py` files. Domain logic
      (service.py, repository.py, etc.) must remain transport-agnostic and
      independently unit-testable.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - "app/modules/"
      exclude:
        - "router.py"
